<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2546C2">
<meta name="color-scheme" content="light dark">
<title>English Stamp Book</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app, sticky header, bottom tab bar; a stamp-book (passport) metaphor carries the progress */
:root{
  --bg:#EEF1EE; --paper:#FBFCFA; --fg:#18212B; --muted:#5E6B72; --line:#D5DCD6;
  --ink:#2546C2; --ink-soft:#E3E8FA; --good:#16794C; --good-soft:#DDF1E6; --bad:#C23B22; --bad-soft:#F9E1DB; --gold:#A87412; --gold-soft:#F6EBD3;
  --f-display:"Bricolage Grotesque","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --paper:#1A2128; --fg:#E8EDEA; --muted:#98A5AB; --line:#2C363F;
  --ink:#8EA6FF; --ink-soft:#1F2A4D; --good:#5FD39A; --good-soft:#163527; --bad:#FF8A70; --bad-soft:#3D1F18; --gold:#E7B65A; --gold-soft:#3A2D14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --paper:#1A2128; --fg:#E8EDEA; --muted:#98A5AB; --line:#2C363F;
  --ink:#8EA6FF; --ink-soft:#1F2A4D; --good:#5FD39A; --good-soft:#163527; --bad:#FF8A70; --bad-soft:#3D1F18; --gold:#E7B65A; --gold-soft:#3A2D14; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.chip{font-family:var(--f-mono);font-size:12px;padding:5px 10px;border-radius:999px;background:var(--ink-soft);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:24px;font-weight:800}
h3{font-size:17px;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
section.view{padding-block:18px 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.note{font-size:14px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--ink);color:var(--paper);font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}

/* quiz */
.progress{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.progress i{height:6px;border-radius:3px;background:var(--line)}
.progress i.ok{background:var(--good)} .progress i.no{background:var(--bad)} .progress i.cur{background:var(--ink)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.tag{padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.type{border-color:transparent;background:var(--ink-soft);color:var(--ink);font-weight:700}
.prompt{font-size:20px;line-height:1.45;font-weight:700;margin:4px 0 2px}
.prompt .blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--ink);margin:0 2px;transform:translateY(-3px)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 14px;font-size:16px}
.opt b{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.feedback{border-radius:12px;padding:14px;font-size:15px}
.feedback.ok{background:var(--good-soft)} .feedback.no{background:var(--bad-soft)}
.feedback strong{display:block;font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.feedback.ok strong{color:var(--good)} .feedback.no strong{color:var(--bad)}
.score{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.wronglist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.wronglist li{border-left:3px solid var(--bad);padding:4px 0 4px 12px;font-size:15px}

/* rules */
details.rule{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
details.rule summary{list-style:none;padding:14px 16px;display:flex;gap:10px;align-items:center;cursor:pointer}
details.rule summary::-webkit-details-marker{display:none}
details.rule .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.ex{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:15px;align-items:baseline}
.ex .x{color:var(--bad);font-weight:700} .ex .v{color:var(--good);font-weight:700}
.ex s{color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.new{background:var(--line);color:var(--muted)} .pill.prac{background:var(--gold-soft);color:var(--gold)} .pill.done{background:var(--good-soft);color:var(--good)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.focus{border:2px solid var(--ink)}

/* vocab */
.flash{perspective:1200px}
.flash .face{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px 20px;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}
.word{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1.05;overflow-wrap:anywhere}
.ipa{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.zh{font-size:22px;font-weight:700}
.exs{font-style:italic;font-size:16px}
.vbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vbtns .btn{padding:12px 6px;font-size:15px}
.vbtns .b0{background:var(--bad)} .vbtns .b1{background:var(--gold)} .vbtns .b2{background:var(--good)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--line)}
.seg button{border:0;border-radius:9px;padding:9px 4px;background:transparent;color:var(--muted);font-weight:700;font-size:14px}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--paper);font-size:11px;line-height:18px;font-variant-numeric:tabular-nums}
.spell{font-family:var(--f-mono);font-size:22px;letter-spacing:.04em;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--fg);width:100%}
.spell:focus{outline:3px solid var(--ink-soft);border-color:var(--ink)}
.hint{font-family:var(--f-mono);font-size:18px;letter-spacing:.06em;padding:10px 12px;border-radius:10px;background:var(--gold-soft);color:var(--gold);overflow-wrap:anywhere}
.spellans{font-family:var(--f-mono);letter-spacing:.04em}
.spellans mark{background:var(--gold-soft);color:var(--gold);border-radius:3px;padding:0 1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1.5px solid var(--line);background:var(--paper);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.chipbtn span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chipbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink-soft);color:var(--ink)}
.bw{font-family:var(--f-display);font-size:19px}
.word-item summary{padding:12px 14px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;touch-action:manipulation}
.chart .ax{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart .tip{position:absolute;top:0;right:0;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:8px;font-variant-numeric:tabular-nums;pointer-events:none}
.trend b{font-size:17px}
.arrow{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:800}
.arrow.done{background:var(--good-soft);color:var(--good)} .arrow.bad{background:var(--bad-soft);color:var(--bad)} .arrow.prac{background:var(--gold-soft);color:var(--gold)} .arrow.new{background:var(--line);color:var(--muted)}
.tscroll{overflow-x:auto}
.ttable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ttable th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
.ttable td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.field textarea{font:inherit;font-weight:400;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--fg);resize:vertical}
.ask{background:none;border:0;padding:0;margin-top:6px;color:var(--ink);font-size:14px;font-weight:700;text-decoration:underline}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:5px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* stamps */
.book{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.slot{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;position:relative;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.slot.milestone{border-color:var(--gold);color:var(--gold)}
.slot svg{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px)}
.slot.fresh svg{animation:thump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes thump{0%{transform:scale(1.8) rotate(-20deg);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.slot.fresh svg{animation:none}}
.big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.cert{border:2px solid var(--gold);border-radius:16px;padding:22px 18px;text-align:center;background:var(--gold-soft);display:flex;flex-direction:column;gap:6px}
.cert .t{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--gold)}
.cert .n{font-family:var(--f-display);font-weight:800;font-size:28px}
.log{margin:0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.log li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.plus{color:var(--good);font-weight:700} .minus{color:var(--bad);font-weight:700}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--ink)}
.banner{border-radius:12px;padding:12px 14px;background:var(--gold-soft);color:var(--fg);font-size:14px}
</style>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
a{color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.field input{font:inherit;font-weight:400;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--fg)}
.field input:focus{outline:3px solid var(--ink-soft);border-color:var(--ink)}
.hero-stamp{width:96px;height:96px}
.offline{font-family:var(--f-mono);font-size:11px;padding:4px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Stamp Book<small id="hdrSub">每天 06:00 更新</small></div>
    <div class="row" style="gap:6px"><span class="offline" id="offlineTag" hidden>离线</span><span class="chip" id="hdrChip">🔖 –</span></div>
  </header>
  <div id="sysmsg" class="stack" style="padding-top:12px" hidden></div>

  <section class="view" id="v-auth" hidden></section>
  <section class="view" id="v-quiz" hidden></section>
  <section class="view" id="v-rules" hidden></section>
  <section class="view" id="v-words" hidden></section>
  <section class="view" id="v-stamps" hidden></section>
  <section class="view" id="v-stats" hidden></section>
</div>

<nav class="tabs" aria-label="主菜单" id="tabbar" hidden><div class="in">
  <a href="#quiz" data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>今日测验</a>
  <a href="#rules" data-tab="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>语法规则</a>
  <a href="#words" data-tab="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/><path d="M7 12h6M10 9v6"/></svg>背单词</a>
  <a href="#stamps" data-tab="stamps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5.5"/></svg>印章</a>
  <a href="#stats" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>分析</a>
</div></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
"use strict";
const SUPABASE_URL = "https://zojxnnlkakmwtoeewyxo.supabase.co";
const SUPABASE_KEY = "sb_publishable_LcL3S-aEmRxxsN0gCGgWNw_SoVD0IsR"; // publishable key: safe in the app; row-level security limits data to Min's login
const OWNER_EMAIL = "minlim2003@gmail.com";

/* ---------- time: the app day runs 06:00 → 06:00 Malaysia time (UTC+8) ---------- */
const MS_H = 3600e3;
const dayKey = (t = Date.now()) => new Date(t + 2 * MS_H).toISOString().slice(0, 10);
const addDays = (k, n) => { const d = new Date(k + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const nice = k => { const [, m, d] = k.split("-"); return `${+m}月${+d}日`; };
const resetAt = k => Date.parse(addDays(k, 1) + "T06:00:00+08:00");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);
const LETTERS = "ABCD";
const INTERVALS = [1, 2, 4, 7, 15, 30];
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- local storage (offline copy + pending writes) ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ---------- state ---------- */
const S = {
  sb: null, user: null, ready: false, today: dayKey(),
  days: {}, results: {}, state: null, rules: [], vocab: {},
  qi: 0, picked: null, freshStamp: false, card: 0, flipped: false, saving: false, openRule: null
};

/* ---------- tabs ---------- */
const TABS = ["quiz", "rules", "words", "stamps", "stats"];
function showTab() {
  if (!S.user) { TABS.forEach(n => $("v-" + n).hidden = true); $("v-auth").hidden = false; $("tabbar").hidden = true; return; }
  $("v-auth").hidden = true; $("tabbar").hidden = false;
  const t = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "quiz";
  TABS.forEach(n => { $("v-" + n).hidden = n !== t; });
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.tab === t) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (t === "rules" && S.openRule) renderRules(); else window.scrollTo(0, 0);
}
addEventListener("hashchange", showTab);

/* ---------- derived ---------- */
const todayDay = () => S.days[S.today];
const todayRes = () => S.results[S.today] || { quiz_date: S.today, answers: {}, done: false };
const ruleById = id => S.rules.find(r => r.id === id);

function typeStats() {
  const st = {};
  Object.values(S.results).sort((a, b) => a.quiz_date < b.quiz_date ? -1 : 1).forEach(r => {
    const day = S.days[r.quiz_date]; if (!day) return;
    (day.questions || []).forEach(q => {
      const a = (r.answers || {})[q.id]; if (!a) return;
      const s = st[q.type] || (st[q.type] = { n: 0, ok: 0, days: new Set(), recent: [] });
      s.n++; if (a.correct) s.ok++; s.days.add(r.quiz_date); s.recent.push(!!a.correct);
    });
  });
  return st;
}
function mastery(s) {
  if (!s) return { cls: "new", label: "未练习" };
  const last = s.recent.slice(-4);
  if (s.days.size >= 3 && last.length >= 4 && last.every(Boolean)) return { cls: "done", label: "已掌握" };
  return { cls: "prac", label: `练习中 ${Math.round(100 * s.ok / s.n)}%` };
}

/* ---------- auth view ---------- */
function authMsg(html, kind) {
  const el = $("authMsg"); if (!el) return;
  el.innerHTML = html || ""; el.hidden = !html;
  el.style.background = kind === "ok" ? "var(--good-soft)" : kind === "err" ? "var(--bad-soft)" : "var(--gold-soft)";
  if (html) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function renderAuth(msg) {
  const v = $("v-auth");
  if ($("authForm")) { authMsg(msg); return; } // never rebuild the form: that would wipe what was typed
  v.innerHTML = `<div class="stack">
    <div class="hero-stamp">${stampSvg(S.today, true)}</div>

  S.wordMode = "test"; renderWords(); window.scrollTo(0, 0);
}
function startTest() {
  const pool = testReady().sort((a, b) => (b.hint_debt || 0) - (a.hint_debt || 0) || String(a.test_due || "").localeCompare(String(b.test_due || "")) || (a.test_box || 0) - (b.test_box || 0));
  S.test = { items: pool.slice(0, TEST_MAX).map(w => ({ word: w.word, type: questionType(w), retry: false })), i: 0, hint: 0, answered: null, earned: 0, firstTry: {}, finished: false };
}
function hintText(word, level) {
  const letters = [...word];
  if (level === 1) return letters.map((c, i) => i === 0 || c === " " || c === "-" ? c : "_").join(" ") + `（${letters.filter(c => /[a-z]/i.test(c)).length} 个字母）`;
  return letters.map((c, i) => i % 2 === 0 || c === " " || c === "-" ? c : "_").join(" ");
}
function diffHtml(given, right) {
  const g = [...norm(given)], r = [...right];
  return r.map((c, i) => g[i] && g[i] === c.toLowerCase() ? esc(c) : `<mark>${esc(c)}</mark>`).join("");
}
function renderTest(v, seg) {

function feedbackHtml(w, it, d) {
  const ex = it.type === "sentence" ? `<div class="note">${esc(w.cloze.replace("___", w.word))}<br>${esc(w.cloze_zh || "")}</div>` : `<div class="note">${esc(w.example || "")}</div>`;
  if (d.correct) return `<div class="feedback ok"><strong>拼对了${d.points ? ` · +${d.points} 分` : ""}</strong>${d.hinted ? "用了提示，这个词接下来几周会多测几次。" : "没用提示，下次会隔更久再测。"}${ex}<button class="linkbtn" type="button" id="sayAns">🔊 听发音</button></div>`;

async function answerSpell(given, gaveUp) {
  const T = S.test, it = T.items[T.i], w = S.vocab[it.word];
  if (T.answered) return;
  const correct = !gaveUp && norm(given) === norm(w.word);
  const hinted = T.hint > 0;
  let points = 0;
  T.firstTry[it.word + (it.retry ? "#r" : "")] = correct && !hinted;
  if (!it.retry) {
    const row = { ...w, tests: (w.tests || 0) + 1, last_test: S.today };
    if (correct && !hinted) {
      row.test_correct = (w.test_correct || 0) + 1;
      row.test_box = Math.min((w.test_box || 0) + 1, TEST_GAPS.length);
      let gap = TEST_GAPS[row.test_box - 1];
      if ((w.hint_debt || 0) > 0) { row.hint_debt = w.hint_debt - 1; gap = Math.min(gap, 3); }
      row.test_due = addDays(S.today, gap);
      row.test_stage = Math.max(w.test_stage || 0, it.type === "sentence" ? 2 : 1);
      points = it.type === "sentence" ? 3 : 2;
    } else if (correct && hinted) {
      row.test_correct = (w.test_correct || 0) + 1;
      row.hint_debt = Math.min((w.hint_debt || 0) + 2, 4);
      row.test_due = addDays(S.today, 1);
      points = 1;
    } else {
      row.test_box = 0;
      row.test_due = addDays(S.today, 1);
      if (hinted) row.hint_debt = Math.min((w.hint_debt || 0) + 2, 4);
      row.box = 0; row.due = addDays(S.today, 1); // show the flashcard again tomorrow
    }
    S.vocab[w.word] = row;
    if (!correct) T.items.push({ word: w.word, type: it.type, retry: true }); // practise once more at the end
    if (points) addPoints(points, `${w.word} · ${it.type === "sentence" ? "句子填空" : "看意思拼写"}${hinted ? "（用了提示）" : ""}`);
    T.earned += points;
    write("vocab", row, "word");
  }
  if (!it.retry) {
    const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2));
    const att = { id, at: S.today, word: w.word, qtype: it.type, correct, hinted };
    (S.attempts = S.attempts || {})[id] = att;
    write("vocab_attempts", att, "id");
  }
  T.answered = { given, correct, hinted, gaveUp, points };
  snapshot();
  renderWords();
}

/* ---------- word book: everything learned so far ---------- */
function wordStatus(w) {
  if ((w.hint_debt || 0) > 0 || ((w.tests || 0) > 0 && (w.test_box || 0) === 0)) return { key: "weak", cls: "prac", label: "要加练" };
  if ((w.test_stage || 0) >= 2 && (w.test_box || 0) >= 3) return { key: "master", cls: "done", label: "已掌握" };
  if ((w.test_stage || 0) >= 1) return { key: "spell", cls: "done", label: "会拼写" };
  if ((w.seen || 0) >= 1) return { key: "seen", cls: "new", label: "背过" };
  return { key: "new", cls: "new", label: "未背" };
}

/* ---------- ask Claude: opens a new Claude chat with the question filled in ---------- */
function askClaude(prompt) {
  const url = "https://claude.ai/new?q=" + encodeURIComponent(prompt.slice(0, 1800));
  const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- analysis: am I improving? ---------- */
const pct = (a, b) => b ? Math.round(100 * a / b) : null;
function trendWord(now, before, n) {
  if (now == null || before == null || n < 6) return { cls: "new", icon: "…", text: "数据还不够" };
  const d = now - before;
  if (d >= 5) return { cls: "done", icon: "↑", text: `进步了 ${d} 个百分点` };
  if (d <= -5) return { cls: "bad", icon: "↓", text: `退步了 ${-d} 个百分点` };
  return { cls: "prac", icon: "→", text: "差不多，没有明显变化" };
}
function lineChart(id, pts, opts = {}) {
  // pts: [{label, value(0-100) | null}] ; one series, so the title names it and no legend box is needed
  const W = 340, H = 170, L = 34, R = 10, T = 12, B = 26, iw = W - L - R, ih = H - T - B;
  const n = pts.length, x = i => L + (n <= 1 ? iw / 2 : i * iw / (n - 1)), y = v => T + ih - v / 100 * ih;
  const valid = pts.map((p, i) => ({ ...p, i })).filter(p => p.value != null);
  const path = valid.map((p, k) => `${k ? "L" : "M"}${x(p.i).toFixed(1)},${y(p.value).toFixed(1)}`).join("");
  const grid = [0, 50, 100].map(g => `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end" class="ax">${g}%</text>`).join("");
  const ticks = pts.map((p, i) => (i === 0 || i === n - 1 || (n > 6 && i === Math.floor((n - 1) / 2))) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" class="ax">${esc(p.label)}</text>` : "").join("");
  const last = valid[valid.length - 1];
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "")}">${grid}
    ${opts.avg != null ? `<line x1="${L}" x2="${W - R}" y1="${y(opts.avg)}" y2="${y(opts.avg)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/><text x="${L + 4}" y="${opts.avg > 50 ? y(opts.avg) + 13 : y(opts.avg) - 5}" text-anchor="start" class="ax">平均 ${opts.avg}%</text>` : ""}
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${valid.map(p => `<circle cx="${x(p.i)}" cy="${y(p.value)}" r="${p === last ? 5 : 4}" fill="var(--ink)" stroke="var(--paper)" stroke-width="2"/>`).join("")}
    ${ticks}
    ${valid.map(p => `<rect class="hit" x="${x(p.i) - Math.max(8, iw / n / 2)}" y="${T}" width="${Math.max(16, iw / n)}" height="${ih}" fill="transparent" data-tip="${esc(p.label)}：${p.value}%${p.note ? " · " + esc(p.note) : ""}"/>`).join("")}
  </svg><div class="tip" hidden></div></div>`;
}
function bindCharts(root) {

function renderStats() {
  const v = $("v-stats");
  if (!S.ready) { v.innerHTML = loadingCard("正在整理你的数据…"); return; }
  // 1) daily quiz accuracy, last 21 app days
  const days = Array.from({ length: 21 }, (_, i) => addDays(S.today, i - 20));
  const quizPts = days.map(d => { const r = S.results[d]; const q = S.days[d]; if (!r || !q) return { label: nice(d), value: null };
    const ans = Object.values(r.answers || {}); return { label: nice(d), value: ans.length ? pct(ans.filter(a => a.correct).length, ans.length) : null, note: r.done ? `${r.score}/${r.total}` : "没做完" }; });
  const scored = quizPts.filter(p => p.value != null);
  const recent = Object.values(S.results).filter(r => r.quiz_date > addDays(S.today, -7));
  const prev = Object.values(S.results).filter(r => r.quiz_date <= addDays(S.today, -7) && r.quiz_date > addDays(S.today, -14));
  const acc = rs => { const a = rs.flatMap(r => Object.values(r.answers || {})); return { p: pct(a.filter(x => x.correct).length, a.length), n: a.length }; };
  const A = acc(recent), Bq = acc(prev);
  const quizTrend = trendWord(A.p, Bq.p, Math.min(A.n, Bq.n));
  const avg = scored.length ? Math.round(scored.reduce((s, p) => s + p.value, 0) / scored.length) : null;
  // 2) grammar types: first half vs second half of answers
  const byType = {};
  Object.values(S.results).sort((a, b) => a.quiz_date.localeCompare(b.quiz_date)).forEach(r => Object.values(r.answers || {}).forEach(a => (byType[a.type] = byType[a.type] || []).push(!!a.correct)));
  const typeRows = Object.entries(byType).filter(([, xs]) => xs.length >= 4).map(([t, xs]) => {
    const h = Math.floor(xs.length / 2), e = xs.slice(0, h), l = xs.slice(h);
    const ep = pct(e.filter(Boolean).length, e.length), lp = pct(l.filter(Boolean).length, l.length);
    return { t, label: (ruleById(t) || {}).label || t, ep, lp, d: lp - ep, n: xs.length };
  }).sort((a, b) => b.d - a.d);
  // 3) spelling: first-try accuracy without hint per week
  const atts = Object.values(S.attempts || {});
  const weeks = Array.from({ length: 6 }, (_, i) => { const end = addDays(S.today, -7 * (5 - i)), start = addDays(end, -6);
    const xs = atts.filter(a => a.at >= start && a.at <= end); return { label: `${nice(start)}起`, value: xs.length ? pct(xs.filter(a => a.correct && !a.hinted).length, xs.length) : null, note: xs.length ? `${xs.length} 题，用提示 ${xs.filter(a => a.hinted).length} 次` : "" }; });
  const sp7 = atts.filter(a => a.at > addDays(S.today, -7)), spPrev = atts.filter(a => a.at <= addDays(S.today, -7) && a.at > addDays(S.today, -14));
  const sAcc = xs => pct(xs.filter(a => a.correct && !a.hinted).length, xs.length), hintRate = xs => pct(xs.filter(a => a.hinted).length, xs.length);
  const spellTrend = trendWord(sAcc(sp7), sAcc(spPrev), Math.min(sp7.length, spPrev.length));
  // 4) consistency
  const avail = Object.keys(S.days).filter(d => d >= ((S.state && S.state.start_date) || S.today) && d <= S.today);
  const doneDays = avail.filter(d => S.results[d] && S.results[d].done).length;
  const vAll = Object.values(S.vocab);
  const mastered = vAll.filter(w => wordStatus(w).key === "master").length, spell = vAll.filter(w => (w.test_stage || 0) >= 1).length;

  const tile = (label, tr) => `<div class="trend"><div class="eyebrow">${label}</div><div class="row" style="gap:8px"><span class="arrow ${tr.cls}" aria-hidden="true">${tr.icon}</span><b>${tr.text}</b></div></div>`;
  v.innerHTML = `<div class="stack">
    <div><div class="eyebrow">最近 7 天 vs 之前 7 天</div><h2>我有没有进步？</h2></div>
    <div class="card stack">${tile("语法测验正确率", quizTrend)}
      <p class="note" style="margin:0">最近 7 天 ${A.p ?? "–"}%（${A.n} 题） · 之前 7 天 ${Bq.p ?? "–"}%（${Bq.n} 题）</p>
      ${tile("单词拼写（一次拼对、不用提示）", spellTrend)}
      <p class="note" style="margin:0">最近 7 天 ${sAcc(sp7) ?? "–"}%（${sp7.length} 题，提示用了 ${hintRate(sp7) ?? 0}%） · 之前 7 天 ${sAcc(spPrev) ?? "–"}%（${spPrev.length} 题）</p>
      ${Math.min(A.n, Bq.n) < 6 ? `<div class="banner">要连续用两个星期，前后两段都有足够的题目，才判断得出有没有进步。现在先看下面的每日记录。</div>` : ""}
    </div>
    <div class="card stack"><h3>每日测验正确率（最近 21 天）</h3>
      ${scored.length ? lineChart("chQuiz", quizPts, { avg, aria: "每日测验正确率折线图" }) : `<p class="note" style="margin:0">还没有测验记录。</p>`}
      <p class="note" style="margin:0">点一下圆点可以看当天的分数。空着的日子表示没做。</p></div>
    <div class="card stack"><h3>各类语法：早期 vs 最近</h3>
      ${typeRows.length ? `<div class="tscroll"><table class="ttable"><thead><tr><th>类型</th><th>早期</th><th>最近</th><th>变化</th></tr></thead><tbody>
        ${typeRows.map(r => `<tr><td>${esc(r.label)}<div class="count">${r.n} 题</div></td><td>${r.ep}%</td><td><b>${r.lp}%</b></td><td><span class="arrow ${r.d >= 10 ? "done" : r.d <= -10 ? "bad" : "prac"}">${r.d >= 10 ? "↑" : r.d <= -10 ? "↓" : "→"}</span> ${r.d > 0 ? "+" : ""}${r.d}</td></tr>`).join("")}
      </tbody></table></div><p class="note" style="margin:0">每种类型把你答过的题按时间分成前后两半来比较。少于 4 题的类型不列出来。</p>` : `<p class="note" style="margin:0">每种类型至少答过 4 题后，这里会显示前后对比。</p>`}</div>
    <div class="card stack"><h3>单词拼写正确率（每周）</h3>
      ${atts.length ? lineChart("chSpell", weeks, { aria: "每周拼写正确率折线图" }) : `<p class="note" style="margin:0">做过拼写测验后，这里会显示每周的变化。</p>`}</div>
    <div class="stats"><div class="stat"><b>${doneDays}/${avail.length || 0}</b><span>完成测验的天数</span></div><div class="stat"><b>${spell}</b><span>会拼写的单词</span></div><div class="stat"><b>${mastered}</b><span>已掌握的单词</span></div></div>
    <div class="card stack"><h3>💬 有问题，直接问 Claude</h3>
      <label class="field">你的问题<textarea id="askBox" rows="3" placeholder="例如：whether 和 if 有什么分别？"></textarea></label>
      <button class="btn" id="askBtn" type="button">打开 Claude 问这个问题</button>
      <button class="linkbtn" id="askReport" type="button" style="align-self:flex-start">把我这两周的分析发给 Claude，请它给建议</button>
      <p class="note" style="margin:0">会打开 Claude App 的新对话，问题已经填好。Claude 记得你的英文错误记录。</p></div>
  </div>`;
  bindCharts(v);
  $("askBtn").onclick = () => { const t = $("askBox").value.trim(); if (!t) { $("askBox").focus(); return; } askClaude(`（来自我的英文学习 App）${t}\n请用中文解释，并给例子。`); };
  $("askReport").onclick = () => askClaude(`这是我英文学习 App 的数据，请用中文帮我分析有没有进步、哪里最弱，并给我下周的练习建议：\n- 语法测验正确率：最近 7 天 ${A.p ?? "无"}%（${A.n} 题），之前 7 天 ${Bq.p ?? "无"}%（${Bq.n} 题）\n- 各类型（早期→最近）：${typeRows.map(r => `${r.label} ${r.ep}%→${r.lp}%`).join("；") || "数据不足"}\n- 单词拼写一次拼对率：最近 7 天 ${sAcc(sp7) ?? "无"}%，之前 ${sAcc(spPrev) ?? "无"}%；提示使用率 ${hintRate(sp7) ?? 0}%\n- 完成测验 ${doneDays}/${avail.length} 天，会拼写 ${spell} 个词，已掌握 ${mastered} 个词`);
}

/* ---------- vocabulary points (separate from stamps) ---------- */
function addPoints(n, note) {
  const sc = clone(S.vscore || { id: 1, points: 0, log: [] });
  sc.points = (sc.points || 0) + n;
  sc.log = [...(sc.log || []), { date: S.today, delta: n, note }].slice(-200);
  sc.updated_at = new Date().toISOString();
  S.vscore = sc;
  write("vocab_score", sc, "id");
}
function renderPoints(v, seg) {
  const sc = S.vscore || { points: 0, log: [] };
  const pts = sc.points || 0, level = Math.floor(pts / 50) + 1, inLevel = pts % 50;
  const today = (sc.log || []).filter(l => l.date === S.today).reduce((a, l) => a + l.delta, 0);
  const all = Object.values(S.vocab);
  const tested = all.filter(w => (w.tests || 0) > 0);
  const acc = tested.length ? Math.round(100 * tested.reduce((a, w) => a + (w.test_correct || 0), 0) / tested.reduce((a, w) => a + (w.tests || 0), 0)) : 0;
  const s1 = all.filter(w => (w.test_stage || 0) >= 1).length, s2 = all.filter(w => (w.test_stage || 0) >= 2).length;

    <div class="book stack">
      <div class="row"><div class="grow"><div class="eyebrow">单词积分 · 第 ${level} 级</div><div class="big">${pts}</div></div><div class="note" style="text-align:right">今天 +${today}<br>再 ${50 - inLevel} 分升到第 ${level + 1} 级</div></div>
      <div class="meter" aria-label="升级进度"><i style="width:${inLevel * 2}%"></i></div>
      <p class="note" style="margin:0">这里的积分和印章分开计算。看意思拼对 +2，句子填空拼对 +3，用了提示拼对 +1，一整轮（至少 5 题）全对且没用提示再 +5。</p>
    </div>
    <div class="stats"><div class="stat"><b>${s1}</b><span>会拼写</span></div><div class="stat"><b>${s2}</b><span>会用在句子里</span></div><div class="stat"><b>${acc}%</b><span>拼写正确率</span></div></div>
    ${debt.length ? `<div class="card stack"><h3>用过提示、要加练的词</h3><ul class="log">${debt.map(w => `<li><span><b>${esc(w.word)}</b> <span class="muted">${esc(w.zh)}</span></span><span class="count">还要多测 ${w.hint_debt} 次</span></li>`).join("")}</ul></div>` : ""}
    <div class="card stack"><h3>积分记录</h3>${(sc.log || []).length ? `<ul class="log">${[...sc.log].reverse().slice(0, 40).map(l => `<li><span>${esc(nice(l.date))} · ${esc(l.note)}</span><span class="plus">+${l.delta}</span></li>`).join("")}</ul>` : `<p class="note" style="margin:0">还没有积分。先去「翻卡片」背几个词，再来「拼写测验」。</p>`}</div>
  </div>`;
}

/* ---------- stamps ---------- */
function stampSvg(k, filled) {
  const [, m, d] = k.split("-");
  const rot = ((+d * 37) % 24) - 12;
  return `<svg viewBox="0 0 100 100" aria-hidden="true" style="transform:rotate(${rot}deg);width:100%;height:100%"><g fill="none" stroke="var(--ink)" stroke-width="3" opacity="${filled ? .92 : .25}">
    <circle cx="50" cy="50" r="44"/><circle cx="50" cy="50" r="36" stroke-width="1.5" stroke-dasharray="3 3"/></g>
    <text x="50" y="44" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" fill="var(--ink)">${+m}/${+d}</text>
    <text x="50" y="66" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="20" fill="var(--ink)">DONE</text></svg>`;
}
function renderStamps() {
  const v = $("v-stamps");

    return `<div class="slot ${i === 9 || i === 19 ? "milestone" : ""} ${k && S.freshStamp && i === n - 1 ? "fresh" : ""}">${k ? stampSvg(k, true) : ms}</div>`;
  }).join("");

      <div class="slots">${slots}</div>

    </div>

    <div class="card stack"><div class="row"><h3 class="grow">20 个印章奖励</h3><span class="pill ${unlocked ? "done" : "new"}">${unlocked ? "已解锁" : "未解锁"}</span></div>

    <div class="card stack"><h3>印章记录</h3>${(st.log || []).length ? `<ul class="log">${[...st.log].reverse().slice(0, 40).map(l => `<li><span>${esc(nice(l.date))} · ${esc(l.note)}</span><span class="${l.delta > 0 ? "plus" : "minus"}">${l.delta > 0 ? "+1" : "−1"}</span></li>`).join("")}</ul>` : `<p class="note" style="margin:0">还没有记录。完成今天的测验，盖下第一个印章。</p>`}</div>

/* ---------- daily reminder (Web Push from the server at the chosen time) ---------- */
const VAPID_PUBLIC = "BO_udvM-uQX6RtmvFkTv6BDawh-UnC2ny2HAUJkAzGsV6xGhbK2bYTkkPHXM0YXGLbwXHtdh4X4cjGVADExHH9I";
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const b64ToBytes = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
function reminderCard() {
  const r = S.reminder || { enabled: false, remind_time: "20:00" };
  const t = String(r.remind_time || "20:00").slice(0, 5);
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  const on = r.enabled && perm === "granted";
  const status = !pushSupported() ? "这台手机不支持通知。请用 Chrome 安装的 App 打开。" :
    perm === "denied" ? "通知被手机挡住了。请到手机「设置 → 应用 → Stamp Book → 通知」打开，再回来点「开启提醒」。" :
    on ? `每天 ${t} 会提醒你；如果那时已经做完今天的测验，就不会打扰你。` : "还没开启。选一个时间，然后点「开启提醒」。";
  return `<div class="card stack" id="reminderCard"><div class="row"><h3 class="grow">每日提醒</h3><span class="pill ${on ? "done" : "new"}">${on ? "已开启" : "未开启"}</span></div>
    <label class="field">提醒时间（马来西亚时间）<input id="remindTime" type="time" value="${esc(t)}" step="300"></label>
    <div class="row" style="gap:8px">
      <button class="btn grow" id="remindOn" type="button">${on ? "保存时间" : "开启提醒"}</button>
      ${on ? `<button class="btn ghost grow" id="remindOff" type="button">关闭提醒</button>` : ""}
    </div>
    ${on ? `<button class="linkbtn" id="remindTest" type="button" style="align-self:flex-start">发一条测试通知</button>` : ""}
    <p class="note" id="remindMsg" style="margin:0">${status}</p></div>`;
}
function remindMsg(t) { const el = $("remindMsg"); if (el) el.textContent = t; }
function bindReminder() {
  if ($("remindOn")) $("remindOn").onclick = () => enableReminder($("remindTime").value);
  if ($("remindOff")) $("remindOff").onclick = disableReminder;
  if ($("remindTest")) $("remindTest").onclick = testReminder;
}
async function enableReminder(time) {
  if (!/^\d{2}:\d{2}$/.test(time || "")) return remindMsg("请先选一个时间。");
  if (!pushSupported()) return remindMsg("这台手机不支持通知。请用 Chrome 安装的 App 打开。");
  if (!navigator.onLine) return remindMsg("现在没有网络，连上网络后再设置。");
  $("remindOn").disabled = true; remindMsg("正在设置…");
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { remindMsg("你没有允许通知。请到手机「设置 → 应用 → Stamp Book → 通知」打开，再回来点「开启提醒」。"); return; }
    const reg = await withTimeout(navigator.serviceWorker.ready, 10000);
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) }));
    const j = sub.toJSON();
    const r1 = await S.sb.from("push_subs").upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: "endpoint" });
    if (r1.error) throw r1.error;
    // if the new time is still ahead today, allow today's reminder to fire again
    const nowMin = (() => { const d = new Date(Date.now() + 8 * MS_H); return d.getUTCHours() * 60 + d.getUTCMinutes(); })();
    const [h, m] = time.split(":").map(Number), since6 = x => (x - 360 + 1440) % 1440;
    const row = { id: 1, enabled: true, remind_time: time };
    if (since6(h * 60 + m) > since6(nowMin)) row.last_sent_date = null;
    const r2 = await S.sb.from("reminder_settings").upsert(row, { onConflict: "id" });
    if (r2.error) throw r2.error;
    S.reminder = { ...(S.reminder || {}), ...row };
    renderStamps(); remindMsg(`✅ 设置好了，每天 ${time} 提醒你（已经做完测验的日子不会提醒）。`);
  } catch (e) {
    remindMsg("设置失败：" + (e.message || e) + "。请检查网络后再试一次。");
  } finally { if ($("remindOn")) $("remindOn").disabled = false; }
}
async function disableReminder() {
  const r = await S.sb.from("reminder_settings").upsert({ id: 1, enabled: false }, { onConflict: "id" });
  if (r.error) return remindMsg("关闭失败：" + r.error.message);
  S.reminder = { ...(S.reminder || {}), enabled: false }; renderStamps(); remindMsg("提醒已关闭。");
}
async function testReminder() {
  remindMsg("正在发送…");
  try {
    const { data, error } = await withTimeout(S.sb.functions.invoke("send-reminders", { body: { test: true } }));
    if (error) throw error;
    remindMsg(data && data.sent ? "测试通知已经发出，几秒内应该会收到。没收到的话，检查手机有没有开「勿扰模式」。" : "服务器没有找到这台手机的通知登记，请再点一次「保存时间」。");
  } catch (e) { remindMsg("发送失败：" + (e.message || e)); }
}

/* ---------- shell ---------- */
function dayNo() { const s = (S.state && S.state.start_date) || S.today; return Math.round((Date.parse(S.today) - Date.parse(s)) / 864e5) + 1; }
function countdown() { const ms = Math.max(0, resetAt(S.today) - Date.now()); const h = Math.floor(ms / MS_H), m = Math.floor(ms % MS_H / 6e4); return `${h} 小时 ${m} 分`; }
function loadingCard(t) { return `<div class="card note">${t}</div>`; }
function renderHeader() {
  $("hdrChip").textContent = `🔖 ${S.state ? S.state.stamps || 0 : "–"}`;
  $("hdrSub").textContent = S.ready ? `${nice(S.today)} 这一轮 · 06:00 更新` : "每天 06:00 更新";

function renderAll() { renderHeader(); if (!S.user) { renderAuth(); showTab(); return; } renderQuiz(); renderRules(); renderWords(); renderStamps(); renderStats(); showTab(); }
function sys(html) { const el = $("sysmsg"); el.innerHTML = html; el.hidden = !html; }

/* ---------- data ---------- */
function snapshot() { LS.set("sb-snapshot", { days: S.days, results: S.results, state: S.state, rules: S.rules, vocab: S.vocab, vscore: S.vscore, at: Date.now() }); }
function pendingKey(table, row, pk) { return table + ":" + row[pk]; }
async function write(table, row, pk) {
  const pend = LS.get("sb-pending", {});
  pend[pendingKey(table, row, pk)] = { table, row, pk };
  LS.set("sb-pending", pend);
  await flush();
}
async function flush() {
  if (!S.sb || !S.user || !navigator.onLine) { renderHeader(); return; }
  const pend = LS.get("sb-pending", {});
  for (const [k, { table, row, pk }] of Object.entries(pend)) {
    const { error } = await S.sb.from(table).upsert(row, { onConflict: pk });
    if (error) { sys(`<div class="banner">有记录还没存上（${esc(error.message)}）。连上网络后会自动再试。</div>`); return; }
    const cur = LS.get("sb-pending", {}); if (JSON.stringify(cur[k] && cur[k].row) === JSON.stringify(row)) { delete cur[k]; LS.set("sb-pending", cur); }
  }
  sys("");
}
const byKey = (rows, k) => Object.fromEntries((rows || []).map(r => [r[k], r]));

async function load() {
  const since = addDays(S.today, -60);
  const va = await S.sb.from("vocab_attempts").select("*").gte("at", addDays(S.today, -120));
  if (!va.error) S.attempts = byKey(va.data, "id");
  const vs = await S.sb.from("vocab_score").select("*").eq("id", 1).maybeSingle();
  if (!vs.error) S.vscore = vs.data || { id: 1, points: 0, log: [] };
  S.sb.from("reminder_settings").select("*").eq("id", 1).maybeSingle().then(r => { if (!r.error) { S.reminder = r.data; if (!$("v-stamps").hidden) renderStamps(); } });
  const [dq, qr, st, rl, vc] = await Promise.all([
    S.sb.from("daily_quiz").select("*").gte("quiz_date", since),
    S.sb.from("quiz_results").select("*").gte("quiz_date", since),
    S.sb.from("stamp_state").select("*").eq("id", 1).maybeSingle(),
    S.sb.from("rule_library").select("*"),
    S.sb.from("vocab").select("*")
  ]);
  const err = [dq, qr, st, rl, vc].find(r => r.error);
  if (err) throw err.error;
  // drop malformed questions so one bad item can't break the whole quiz
  (dq.data || []).forEach(d => { d.questions = (Array.isArray(d.questions) ? d.questions : []).filter(q =>
    q && q.id && typeof q.prompt === "string" && Array.isArray(q.options) && q.options.length >= 2 && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length); });
  S.days = byKey((dq.data || []).filter(d => d.questions.length), "quiz_date"); S.results = byKey(qr.data, "quiz_date");
  S.state = st.data; S.rules = rl.data || []; S.vocab = byKey(vc.data, "word");
  // keep this device's unsynced answers on top of what the server has
  Object.values(LS.get("sb-pending", {})).forEach(({ table, row }) => {
    if (table === "quiz_results") S.results[row.quiz_date] = row;
    if (table === "vocab") S.vocab[row.word] = row;
    if (table === "stamp_state") S.state = row;
    if (table === "vocab_score") S.vscore = row;
    if (table === "vocab_attempts") (S.attempts = S.attempts || {})[row.id] = row;
  });
}
async function settle() {
  const yesterday = addDays(S.today, -1);
  let st = S.state;
  if (!st) {
    st = { id: 1, start_date: S.today, stamps: 0, settled_through: yesterday, log: [] };
    S.state = st; await write("stamp_state", st, "id"); return;
  }
  if (st.settled_through >= yesterday) return;
  st = clone(st);
  let d = addDays(st.settled_through, 1);
  while (d <= yesterday) {
    if (S.days[d] && !(S.results[d] && S.results[d].done) && d >= st.start_date && (st.stamps || 0) > 0) {
      st.stamps -= 1; st.log = [...(st.log || []), { date: d, delta: -1, note: "没完成测验" }].slice(-120);
    }
    d = addDays(d, 1);
  }
  st.settled_through = yesterday;
  S.state = st; await write("stamp_state", st, "id");
}
async function refresh() {
  try {
    await load(); S.ready = true; await settle(); snapshot(); sys("");
  } catch (e) {
    const snap = LS.get("sb-snapshot", null);
    if (snap) { Object.assign(S, { days: snap.days, results: snap.results, state: snap.state, rules: snap.rules, vocab: snap.vocab, vscore: snap.vscore }); S.ready = true;
      sys(`<div class="banner">现在连不上网络，显示的是上次保存的内容。答题记录会在连上网络后自动上传。</div>`); }
    else sys(`<div class="banner">读取数据失败：${esc(e.message || e)}。请检查网络后重新打开。</div>`);
  }
  renderAll();
}

// any unexpected error is shown instead of the app silently doing nothing
addEventListener("error", e => sys(`<div class="banner">App 出错了：${esc(e.message)}。请关掉 App 重新打开；如果一直出现，截图发给 Claude。</div>`));
addEventListener("unhandledrejection", e => sys(`<div class="banner">App 出错了：${esc((e.reason && e.reason.message) || e.reason)}。请重新打开 App；如果一直出现，截图发给 Claude。</div>`));

async function boot() {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(reg => reg.update()).catch(() => {});
    // when a new version takes over, reload once so the phone never keeps running old code
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded && navigator.serviceWorker.controller && sessionStorage.getItem("sw-seen")) { reloaded = true; location.reload(); } sessionStorage.setItem("sw-seen", "1"); });
    if (navigator.serviceWorker.controller) sessionStorage.setItem("sw-seen", "1");
  }
  addEventListener("online", () => { flush(); refresh(); });
  addEventListener("offline", renderHeader);
  if (!window.supabase) {
    const snap = LS.get("sb-snapshot", null);
    S.user = snap ? { offline: true } : null;
    if (snap) { Object.assign(S, { days: snap.days, results: snap.results, state: snap.state, rules: snap.rules, vocab: snap.vocab, vscore: snap.vscore }); S.ready = true; }
    renderAll(); sys(`<div class="banner">现在连不上网络。</div>`); return;
  }
  S.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await S.sb.auth.getSession();
  S.user = data.session ? data.session.user : null;
  renderAll();
  if (S.user) refresh();
  S.sb.auth.onAuthStateChange((evt, session) => {
    const was = !!S.user; S.user = session ? session.user : null;
    if (!was && S.user) { S.ready = false; renderAll(); refresh(); }
    if (was && !S.user) { S.ready = false; renderAll(); }
  });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.user) { const k = dayKey(); if (k !== S.today) { S.today = k; S.picked = null; S.card = 0; } refresh(); } });
  setInterval(async () => { const k = dayKey(); if (k !== S.today && S.user) { S.today = k; S.picked = null; S.card = 0; await refresh(); } }, 60e3);
}
boot();
})();
</script>
